<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>

<body>
    <header>
        <h1>Calculadora</h1>
    </header>

    <main>
        <div class="displayContainer">
            <input type="text" id="display" readonly>
        </div>

        <div class="buttons">
            <button class="util clear" id="clear" value="clear">C</button>
            <button class="util deleteOne" value="delete">⇽</button>
            <button class="opera byHundred" value="%">%</button>
            <button class="opera divisor" value="/">÷</button>

            <button class="number" value="1">1</button>
            <button class="number" value="2">2</button>
            <button class="number" value="3">3</button>
            <button class="opera multiplicator" value="*">✕</button>

            <button class="number" value="4">4</button>
            <button class="number" value="5">5</button>
            <button class="number" value="6">6</button>
            <button class="opera minus" value="-">-</button>

            <button class="number" value="7">7</button>
            <button class="number" value="8">8</button>
            <button class="number" value="9">9</button>
            <button class="opera adder" value="+">+</button>

            <button class="util comma" value=".">,</button>
            <button class="number zero" value="0">0</button>
            <button class="util equal" id="equal" value="equals">=</button>
        </div>
    </main>

    <footer>
        <a href="https://github.com/VitorFikle" target="_blank">©2026, Vitor da Silva</a>
    </footer>

    <script src="script.js"></script>
</body>

</html>
